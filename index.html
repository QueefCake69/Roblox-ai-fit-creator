<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Outfit Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>ROBLOX OUTFIT GENERATOR</h1>
        <p>Enter your Roblox username and generate outfits from items you own.</p>

        <div class="search-box">
            <input id="username" type="text" placeholder="Enter Roblox username">
            <button onclick="generateOutfit()">GENERATE</button>
        </div>

        <div id="result">
            <h2>Your Outfit</h2>
            <p id="message">Enter your username to get started.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
